<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registry overview · XYENA</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="dashboard"><div id="portal-root"></div><template id="page-content">
  <section class="page-intro"><div><strong>Tenant identity position</strong><p>Monitor legal status, review workload and identity-risk signals. Financing decisions remain in the Xyena portal.</p></div><a class="primary-button" href="/businesses">Search the register</a></section>

</template><script src="/assets/app.js" defer></script></body>

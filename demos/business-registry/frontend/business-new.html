<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create business record · XYENA</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="business-new"><div id="portal-root"></div><template id="page-content">
  <section class="page-intro"><div><strong>New registry intake</strong><p>The operator records identity facts. The result remains pending until a reviewer activates or rejects it.</p></div><span class="status status-pending-review">Creates pending review</span></section>
  <form id="businessForm" class="panel"><div class="panel-header"><div><p class="section-label">Identity application</p><h2>Business particulars</h2></div><div class="panel-header-actions"><span class="panel-note">All values are synthetic</span><button class="secondary-button" id="autoFillBusinessButton" type="button">Auto-fill all fields</button></div></div><div class="panel-body"><div class="form-grid">
    <div class="field"><label for="registryNumber">Registry number</label><input id="registryNumber" maxlength="40" placeholder="U28999KA2026PTC145201" required></div><div class="field"><label for="businessId">Shared business ID</label><input id="businessId" maxlength="80" pattern="[a-z0-9_-]+" placeholder="biz_demo_supplier_01" required></div><div class="field"><label for="businessTypeInput">Business type</label><select id="businessTypeInput"><option>COMPANY</option><option>LLP</option><option>PARTNERSHIP</option><option>PROPRIETORSHIP</option><option>OTHER</option></select></div>
    <div class="field span-2"><label for="legalName">Legal name</label><input id="legalName" maxlength="200" required></div><div class="field"><label for="tradeName">Trade name</label><input id="tradeName" maxlength="160"></div><div class="field"><label for="incorporationDate">Incorporation date</label><input id="incorporationDate" type="date" required></div><div class="field"><label for="primaryGstin">GSTIN reference</label><input id="primaryGstin" minlength="15" maxlength="15" placeholder="Optional synthetic GSTIN"></div><div class="field"><label for="industryCode">Industry code</label><input id="industryCode" maxlength="20" placeholder="C2599"></div>
    <div class="field"><label for="msmeClass">Declared MSME class</label><select id="msmeClass"><option value="">Not declared</option><option>MICRO</option><option>SMALL</option><option>MEDIUM</option></select></div><div class="field"><label for="stateCode">State code</label><input id="stateCode" maxlength="2" pattern="[0-9]{2}" required></div><div class="field"><label for="postalCode">Postal code</label><input id="postalCode" maxlength="6" pattern="[0-9]{6}" required></div><div class="field span-2"><label for="addressLine1">Registered address line</label><input id="addressLine1" maxlength="180" required></div><div class="field"><label for="city">City</label><input id="city" maxlength="100" required></div>
  </div><div class="form-actions"><a class="secondary-button" href="/businesses">Cancel</a><button class="primary-button" type="submit">Create pending record</button></div></div></form>
</template><script src="/assets/app.js" defer></script></body>
</html>

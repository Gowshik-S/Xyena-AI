<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business register · XYENA</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="businesses"><div id="portal-root"></div><template id="page-content">
  <section class="page-intro"><div><strong>Authoritative synthetic register</strong><p>Search legal name, trade name, registry number, business ID or GSTIN reference within the authenticated tenant.</p></div><a class="primary-button" href="/businesses/new">Create pending record</a></section>
  <form class="filters" id="businessFilters"><div class="field"><label for="businessQuery">Identity search</label><input id="businessQuery" type="search" placeholder="Name, registry number, business ID or GSTIN"></div><div class="field"><label for="businessStatus">Legal status</label><select id="businessStatus"><option value="">All statuses</option><option>ACTIVE</option><option>PENDING_REVIEW</option><option>SUSPENDED</option><option>DISSOLVED</option><option>REJECTED</option></select></div><div class="field"><label for="businessType">Business type</label><select id="businessType"><option value="">All types</option><option>COMPANY</option><option>LLP</option><option>PARTNERSHIP</option><option>PROPRIETORSHIP</option><option>OTHER</option></select></div><button class="secondary-button" type="submit">Apply filters</button></form>
  <section class="panel"><div class="panel-header"><div><p class="section-label">Tenant-scoped records</p><h2>Registered businesses</h2></div><span class="panel-note" id="resultCount">Loading…</span></div><div class="table-wrap"><table><thead><tr><th>Legal identity</th><th>Registry number</th><th>GSTIN</th><th>Type</th><th>Status</th><th>MSME</th><th>Version</th></tr></thead><tbody id="businessRows"><tr><td colspan="7" class="empty-state">Loading business register…</td></tr></tbody></table></div></section>
</template><script src="/assets/app.js" defer></script></body>
</html>

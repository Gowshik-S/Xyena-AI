<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create invoice · XYENA GST</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body data-page="invoice-new">
  <div id="portal-root"></div>
  <template id="page-content">
    <section class="page-intro"><div><strong>New source invoice</strong><p>Enter source facts only. Taxable values, tax split, totals and financial year are calculated by the service.</p></div><span class="status status-draft">Creates draft</span></section>
    <form id="invoiceForm" class="panel">
      <div class="panel-header"><div><p class="section-label">Document identity</p><h2>Invoice header</h2></div><span class="panel-note">Required fields are validated before commit</span></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label for="invoiceNumber">Invoice number</label><input id="invoiceNumber" maxlength="32" placeholder="INV-2026-0042" required></div>
          <div class="field"><label for="invoiceType">Invoice type</label><select id="invoiceType"><option value="B2B">B2B tax invoice</option><option value="DEBIT_NOTE">Debit note</option><option value="CREDIT_NOTE">Credit note</option><option value="EXPORT">Export invoice</option></select></div>
          <div class="field"><label for="invoiceDate">Invoice date</label><input id="invoiceDate" type="date" required></div>
          <div class="field"><label for="buyerGstin">Buyer GSTIN</label><input id="buyerGstin" minlength="15" maxlength="15" placeholder="29ABCDE1234F1Z5" required></div>
          <div class="field span-2"><label for="buyerName">Buyer legal or trade name</label><input id="buyerName" maxlength="180" placeholder="Buyer enterprise" required></div>
          <div class="field"><label for="placeOfSupply">Place of supply code</label><input id="placeOfSupply" maxlength="2" placeholder="29" required></div>
          <div class="field span-2"><label for="purchaseOrder">Purchase order reference</label><input id="purchaseOrder" maxlength="80" placeholder="Optional buyer PO reference"></div>
        </div>
        <section class="line-editor" aria-labelledby="lineItemsHeading">
          <div class="line-editor-header"><div><p class="section-label">Tax calculation input</p><h2 id="lineItemsHeading">Invoice line items</h2></div><button class="secondary-button" id="addLine" type="button">Add line</button></div>
          <div class="line-row line-head" aria-hidden="true"><span>Description</span><span>HSN/SAC</span><span>Qty</span><span>Unit</span><span>Unit price</span><span>Discount</span><span>GST %</span><span>Action</span></div>
          <div id="lineRows"></div>
        </section>
        <div class="form-actions"><a class="secondary-button" href="/invoices">Cancel</a><button class="primary-button" type="submit">Save draft invoice</button></div>
      </div>
    </form>
  </template>
  <script src="/assets/app.js" defer></script>
</body>
</html>

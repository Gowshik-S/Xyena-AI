[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xyena-synthetic-bank-mcp-demo"
version = "0.1.0"
description = "Isolated synthetic bank evidence and transfer-preparation MCP demo for Xyena"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "httpx2>=0.1,<1",
  "mcp>=2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
bank-mcp-demo = "bank_demo.main:run"
bank-mcp-register = "bank_demo.register:main"
bank-mcp-check = "bank_demo.client:main"

[tool.hatch.build.targets.wheel]
packages = ["bank_demo"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "bank_demo/frontend"

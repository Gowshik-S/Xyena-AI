name: xyena-bank-mcp-demo

x-bank-demo: &bank-demo
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    BANK_DEMO_DATABASE_URL: postgresql+asyncpg://bank:${BANK_DEMO_DB_PASSWORD}@postgres:5432/bank_demo
  networks:
    - xyena-backend

services:
  bank-demo:
    <<: *bank-demo
    restart: unless-stopped
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  register:
    <<: *bank-demo
    profiles: ["registration"]
    command: ["bank-mcp-register"]
    depends_on:
      bank-demo:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_demo
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${BANK_DEMO_DB_PASSWORD}
    volumes:
      - bank-demo-data:/var/lib/postgresql/data
    networks:
      - xyena-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  xyena-backend:
    external: true
    name: xyena-core_backend

volumes:
  bank-demo-data:

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
  <title id="title">XYENA AI Secure Autonomous Supply-Finance Architecture</title>
  <desc id="desc">Architecture diagram showing MSME evidence collection, six XYENA agents, decision orchestration, financial controls, Guardian governance, execution decisions, funding, and post-execution monitoring.</desc>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233f"/>
      <stop offset="1" stop-color="#263f73"/>
    </linearGradient>
    <linearGradient id="guardianGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2378"/>
      <stop offset="1" stop-color="#5c3da2"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c8791"/>
      <stop offset="1" stop-color="#12a3a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15233c" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15233c" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f6482"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6748a5"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #d8e3f5; }
      .brand { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 2px; fill: #ffffff; }
      .section-label { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #63748c; }
      .card-title { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #14243e; }
      .card-copy { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #607189; }
      .agent-title { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #14243e; }
      .agent-copy { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #63748c; }
      .white-title { font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #ffffff; }
      .white-copy { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #e8e3f6; }
      .pill { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .verdict-title { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; }
      .verdict-copy { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #607189; }
      .connector { fill: none; stroke: #4f6482; stroke-width: 3; marker-end: url(#arrow); }
      .connector-purple { fill: none; stroke: #6748a5; stroke-width: 3; marker-end: url(#arrowPurple); }
      .feedback { fill: none; stroke: #6748a5; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1600" height="1400" fill="#f4f7fb"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="126" fill="url(#headerGradient)"/>
  <g transform="translate(62 31)">
    <rect width="64" height="64" rx="17" fill="#19b6ae"/>
    <path d="M17 17 L47 47 M47 17 L17 47" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="148" y="59" class="brand">XYENA AI</text>
  <text x="148" y="91" class="subtitle">Secure Autonomous Supply-Finance Orchestration</text>
  <text x="1538" y="55" text-anchor="end" class="title">SYSTEM ARCHITECTURE</text>
  <text x="1538" y="87" text-anchor="end" class="subtitle">Investigate → Propose → Govern → Execute → Monitor</text>

  <!-- Intake -->
  <text x="70" y="165" class="section-label">01  FINANCING REQUEST &amp; EVIDENCE</text>
  <rect x="70" y="184" width="320" height="112" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="124" cy="240" r="28" fill="#e7f8f6"/>
  <path d="M114 244 h20 M118 236 h12 M121 228 h6" stroke="#0c9696" stroke-width="3" stroke-linecap="round"/>
  <text x="168" y="230" class="card-title">MSME Financing Request</text>
  <text x="168" y="254" class="card-copy">Business, amount, consent</text>
  <text x="168" y="274" class="card-copy">and receivable details</text>

  <rect x="600" y="174" width="400" height="132" rx="22" fill="url(#tealGradient)" filter="url(#shadow)"/>
  <text x="800" y="225" text-anchor="middle" class="white-title">Evidence Collection</text>
  <text x="800" y="253" text-anchor="middle" class="white-copy">Collect, normalize and preserve source context</text>
  <rect x="683" y="269" width="234" height="24" rx="12" fill="#ffffff" fill-opacity="0.18"/>
  <text x="800" y="286" text-anchor="middle" class="pill">CONSENTED + OFFICIAL DATA</text>

  <rect x="1210" y="172" width="320" height="136" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1238" y="205" class="card-title">Evidence Sources</text>
  <rect x="1238" y="220" width="120" height="27" rx="13" fill="#eaf1ff"/>
  <text x="1298" y="239" text-anchor="middle" class="agent-copy">GST / e-Invoice</text>
  <rect x="1370" y="220" width="130" height="27" rx="13" fill="#e7f8f6"/>
  <text x="1435" y="239" text-anchor="middle" class="agent-copy">Buyer / Delivery</text>
  <rect x="1238" y="258" width="120" height="27" rx="13" fill="#f0ebfb"/>
  <text x="1298" y="277" text-anchor="middle" class="agent-copy">Payment Data</text>
  <rect x="1370" y="258" width="130" height="27" rx="13" fill="#fff1dd"/>
  <text x="1435" y="277" text-anchor="middle" class="agent-copy">Financial Data</text>

  <path d="M390 240 H600" class="connector"/>
  <path d="M1210 240 H1000" class="connector"/>
  <path d="M800 306 V347" class="connector"/>

  <!-- Six Agents -->
  <text x="70" y="350" class="section-label">02  EVIDENCE &amp; DOMAIN INTELLIGENCE</text>
  <rect x="70" y="370" width="1460" height="207" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="105" y="412" class="card-title">Six Specialized XYENA Agents</text>
  <text x="1495" y="412" text-anchor="end" class="card-copy">Independent findings — no direct money movement</text>

  <g filter="url(#smallShadow)">
    <rect x="104" y="435" width="210" height="105" rx="16" fill="#f7f9fc" stroke="#dbe3ef"/>
    <rect x="104" y="435" width="7" height="105" rx="3" fill="#2e6fd8"/>
    <text x="130" y="472" class="agent-title">Business Agent</text>
    <text x="130" y="497" class="agent-copy">Identity, registration</text>
    <text x="130" y="517" class="agent-copy">and eligibility</text>

    <rect x="340" y="435" width="210" height="105" rx="16" fill="#f7f9fc" stroke="#dbe3ef"/>
    <rect x="340" y="435" width="7" height="105" rx="3" fill="#0c9696"/>
    <text x="366" y="472" class="agent-title">Invoice Agent</text>
    <text x="366" y="497" class="agent-copy">Authenticity, amount</text>
    <text x="366" y="517" class="agent-copy">and duplicates</text>

    <rect x="576" y="435" width="210" height="105" rx="16" fill="#f7f9fc" stroke="#dbe3ef"/>
    <rect x="576" y="435" width="7" height="105" rx="3" fill="#18a66b"/>
    <text x="602" y="472" class="agent-title">Delivery Agent</text>
    <text x="602" y="497" class="agent-copy">Fulfilment and invoice</text>
    <text x="602" y="517" class="agent-copy">consistency</text>

    <rect x="812" y="435" width="210" height="105" rx="16" fill="#f7f9fc" stroke="#dbe3ef"/>
    <rect x="812" y="435" width="7" height="105" rx="3" fill="#e49b26"/>
    <text x="838" y="472" class="agent-title">Payment Agent</text>
    <text x="838" y="497" class="agent-copy">Reconciliation and</text>
    <text x="838" y="517" class="agent-copy">outstanding balance</text>

    <rect x="1048" y="435" width="210" height="105" rx="16" fill="#f7f9fc" stroke="#dbe3ef"/>
    <rect x="1048" y="435" width="7" height="105" rx="3" fill="#dd4f5c"/>
    <text x="1074" y="472" class="agent-title">Fraud / Risk Agent</text>
    <text x="1074" y="497" class="agent-copy">Anomalies, collusion</text>
    <text x="1074" y="517" class="agent-copy">and suspicious patterns</text>

    <rect x="1284" y="435" width="210" height="105" rx="16" fill="#f7f9fc" stroke="#dbe3ef"/>
    <rect x="1284" y="435" width="7" height="105" rx="3" fill="#7654b5"/>
    <text x="1310" y="472" class="agent-title">Credit Agent</text>
    <text x="1310" y="497" class="agent-copy">Capacity and financing</text>
    <text x="1310" y="517" class="agent-copy">recommendation</text>
  </g>

  <path d="M800 577 V617" class="connector"/>

  <!-- Decision + controls -->
  <text x="70" y="621" class="section-label">03  FINANCING DECISION</text>
  <rect x="170" y="642" width="500" height="122" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="225" cy="703" r="31" fill="#eaf1ff"/>
  <path d="M210 704 l10 10 21 -24" fill="none" stroke="#2e6fd8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="275" y="692" class="card-title">Decision Orchestrator</text>
  <text x="275" y="718" class="card-copy">Combines all six findings and creates</text>
  <text x="275" y="739" class="card-copy">a proposed financing action</text>

  <rect x="760" y="625" width="670" height="155" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="794" y="664" class="card-title">XYENA Financial Controls</text>
  <text x="1398" y="664" text-anchor="end" class="card-copy">One aggregate exposure view</text>
  <rect x="794" y="687" width="185" height="56" rx="14" fill="#eaf1ff"/>
  <text x="886" y="710" text-anchor="middle" class="agent-title">Company Limit</text>
  <text x="886" y="730" text-anchor="middle" class="agent-copy">Dynamic capacity</text>
  <rect x="994" y="687" width="185" height="56" rx="14" fill="#fff1dd"/>
  <text x="1086" y="710" text-anchor="middle" class="agent-title">Existing Exposure</text>
  <text x="1086" y="730" text-anchor="middle" class="agent-copy">All funders combined</text>
  <rect x="1194" y="687" width="202" height="56" rx="14" fill="#e7f8f6"/>
  <text x="1295" y="710" text-anchor="middle" class="agent-title">70% Receivable Cap</text>
  <text x="1295" y="730" text-anchor="middle" class="agent-copy">Verified outstanding value</text>

  <path d="M670 703 H760" class="connector"/>
  <path d="M1095 780 V812 H800 V835" class="connector"/>

  <!-- Proposed Action -->
  <rect x="550" y="827" width="500" height="61" rx="30" fill="#13233f" filter="url(#smallShadow)"/>
  <text x="800" y="851" text-anchor="middle" class="white-title" style="font-size:18px">PROPOSED FINANCIAL ACTION</text>
  <text x="800" y="874" text-anchor="middle" class="white-copy">Proposal only — not permission to execute</text>
  <path d="M800 888 V920" class="connector-purple"/>

  <!-- Guardian -->
  <text x="70" y="925" class="section-label">04  INDEPENDENT AGENT GOVERNANCE</text>
  <rect x="70" y="944" width="1460" height="244" rx="28" fill="url(#guardianGradient)" filter="url(#shadow)"/>
  <g transform="translate(110 978)">
    <path d="M26 0 L52 10 V32 C52 51 41 65 26 73 C11 65 0 51 0 32 V10 Z" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2"/>
    <path d="M14 34 l8 8 17 -20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="187" y="1004" class="white-title">Guardian Agent</text>
  <text x="187" y="1030" class="white-copy">Machine-speed maker-checker: should this AI-generated action execute?</text>
  <rect x="1195" y="976" width="285" height="50" rx="25" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="1338" y="998" text-anchor="middle" class="pill">DYNAMIC RISK SCORE</text>
  <text x="1338" y="1018" text-anchor="middle" class="white-copy">Explainable + auditable</text>

  <g>
    <rect x="110" y="1062" width="230" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="225" y="1089" text-anchor="middle" class="pill">Identity + Mandate</text>
    <rect x="358" y="1062" width="230" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="473" y="1089" text-anchor="middle" class="pill">Intent + Provenance</text>
    <rect x="606" y="1062" width="230" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="721" y="1089" text-anchor="middle" class="pill">Evidence Integrity</text>
    <rect x="854" y="1062" width="230" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="969" y="1089" text-anchor="middle" class="pill">Counterparty + Tools</text>
    <rect x="1102" y="1062" width="378" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="1291" y="1089" text-anchor="middle" class="pill">Behaviour + Action Chain</text>

    <rect x="234" y="1120" width="310" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="389" y="1147" text-anchor="middle" class="pill">Exposure + Financial Policy</text>
    <rect x="562" y="1120" width="310" height="43" rx="13" fill="#ffffff" fill-opacity="0.13"/>
    <text x="717" y="1147" text-anchor="middle" class="pill">Context + Data Trust</text>
    <rect x="890" y="1120" width="476" height="43" rx="13" fill="#ffffff" fill-opacity="0.19" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="1128" y="1147" text-anchor="middle" class="pill">ALLOW · CONSTRAIN · VERIFY · BLOCK · ESCALATE</text>
  </g>

  <path d="M800 1188 V1210" class="connector-purple"/>

  <!-- Decisions -->
  <text x="70" y="1218" class="section-label">05  GRADUATED AUTONOMY &amp; CONTINUOUS MONITORING</text>
  <g filter="url(#smallShadow)">
    <rect x="70" y="1238" width="215" height="72" rx="16" fill="#e8f7ee" stroke="#b9e4ca"/>
    <text x="177" y="1266" text-anchor="middle" class="verdict-title" fill="#137a46">ALLOW</text>
    <text x="177" y="1290" text-anchor="middle" class="verdict-copy">Execute autonomously</text>

    <rect x="302" y="1238" width="215" height="72" rx="16" fill="#e9f5f5" stroke="#b4dfdc"/>
    <text x="409" y="1266" text-anchor="middle" class="verdict-title" fill="#087f83">CONSTRAIN</text>
    <text x="409" y="1290" text-anchor="middle" class="verdict-copy">Apply safe limit</text>

    <rect x="534" y="1238" width="215" height="72" rx="16" fill="#fff5e5" stroke="#f2d6a4"/>
    <text x="641" y="1266" text-anchor="middle" class="verdict-title" fill="#a56500">VERIFY</text>
    <text x="641" y="1290" text-anchor="middle" class="verdict-copy">Request trusted proof</text>

    <rect x="766" y="1238" width="215" height="72" rx="16" fill="#fcebed" stroke="#efbdc2"/>
    <text x="873" y="1266" text-anchor="middle" class="verdict-title" fill="#b62f3d">BLOCK</text>
    <text x="873" y="1290" text-anchor="middle" class="verdict-copy">Stop before execution</text>

    <rect x="998" y="1238" width="215" height="72" rx="16" fill="#f0ebfb" stroke="#d4c5ef"/>
    <text x="1105" y="1266" text-anchor="middle" class="verdict-title" fill="#6743a2">ESCALATE</text>
    <text x="1105" y="1290" text-anchor="middle" class="verdict-copy">Human / security review</text>
  </g>

  <rect x="1260" y="1228" width="270" height="92" rx="18" fill="#13233f" filter="url(#smallShadow)"/>
  <text x="1395" y="1257" text-anchor="middle" class="white-title" style="font-size:16px">EXECUTION + MONITOR</text>
  <text x="1395" y="1282" text-anchor="middle" class="white-copy">Bank / funder / ledger</text>
  <text x="1395" y="1304" text-anchor="middle" class="white-copy">Exposure · behaviour · chain</text>

  <path d="M177 1310 V1330 H1235 V1274 H1260" class="connector"/>
  <path d="M409 1310 V1330" fill="none" stroke="#4f6482" stroke-width="3"/>
  <path d="M1530 1274 H1560 V1035 H1530" class="feedback"/>

  <!-- Footer -->
  <line x1="70" y1="1350" x2="1530" y2="1350" stroke="#d9e2ee"/>
  <text x="70" y="1378" class="card-copy">XYENA AI — Verified receivables. Controlled exposure. Governed autonomous action.</text>
  <text x="1530" y="1378" text-anchor="end" class="card-copy">Standalone architecture</text>
</svg>

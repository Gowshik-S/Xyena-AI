apiVersion: v1
kind: Secret
metadata:
  name: xyena-secrets
  namespace: xyena
type: Opaque
stringData:
  XYENA_DATABASE_URL: "postgresql+psycopg://USER:PASSWORD@HOST:5432/xyena"
  XYENA_OPENAI_API_KEY: "replace"
  XYENA_SERVICE_TOKEN: "replace-with-at-least-32-random-bytes"
  XYENA_MCP_ADMIN_TOKEN: "replace-with-separate-high-entropy-review-credential"
  XYENA_GUARDIAN_SIGNING_KEY: "replace-with-escaped-pkcs8-ed25519-private-key"
  XYENA_GUARDIAN_VERIFY_KEY: "replace-with-escaped-ed25519-public-key"
  XYENA_OBJECT_STORE_ACCESS_KEY: "replace"
  XYENA_OBJECT_STORE_SECRET_KEY: "replace"
